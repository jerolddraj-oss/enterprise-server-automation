name: Validate automation repository

on:
  push:
    branches: ["main", "feature/**", "automation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml pytest

      - name: Validate JSON schemas and sample request
        run: python -m pytest -q

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml"))
          files = [p for p in files if ".git" not in p.parts]
          for path in files:
              with path.open(encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))
              print(f"OK {path}")
          PY
