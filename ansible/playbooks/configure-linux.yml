---
- name: Apply baseline to explicitly supplied Linux hosts
  hosts: provisioned_linux
  become: true
  gather_facts: true
  serial: 10
  tasks:
    - name: Require Linux targets
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
        fail_msg: "This playbook is intended for Linux hosts only."
      changed_when: false

  roles:
    - common_baseline
    - linux_baseline
    - compliance_validation
